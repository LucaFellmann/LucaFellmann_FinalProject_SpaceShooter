
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fight for the Universe</title>

    <!-- Connect the CSS file for the design -->
    <link href="style.css" rel="stylesheet">

    <!-- Connect the JavaScript file for the game -->
    <script src="libraries/script.js" defer></script>
</head>

<body>
    <main>

        <!-- LANDING SCREEN: Displays the start image and button -->
        <section class="landing-screen" id="landing-screen">

            <!-- Display the landing screen image -->
            <img
                class="landing-art"
                src="../Assets/Landing%20Screen.png"
                alt="Fight for the Universe - Start the Battle"
                width="1440"
                height="1024"
            >

            <!-- Button to start the game -->
            <button
                class="start-button"
                id="start-button"
                type="button"
                aria-label="Start the battle"
            ></button>

        </section>

        <!-- GAME SCREEN: Contains the canvas and Arduino button -->
        <section class="game-screen" id="game-screen" hidden>

            <!-- Canvas for drawing stars, aliens, spaceship and bullets -->
            <canvas id="game-canvas"></canvas>

            <!-- Button to connect the Arduino controller -->
            <button
                id="connectArduino"
                type="button"
            >Connect Arduino</button>

        </section>

    </main>
</body>
</html>
